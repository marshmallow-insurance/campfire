version: 2
updates:
  - package-ecosystem: npm
    commit-message:
      prefix: "chore(npm-dep): "
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: daily
      time: '05:00'
      timezone: Europe/London
    open-pull-requests-limit: 99
    groups:
      # These share a version lockstep — bumping one at a time leaves two copies
      # of @typescript-eslint/utils in the tree, which breaks the rule tests.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
    ignore:
      # typescript-eslint 8.x peers `typescript >=4.8.4 <6.1.0`, so TS 7 breaks
      # `npm ci` with ERESOLVE. Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        versions: ['>=7']
